# VS Code Continue — Production Configuration
# Author: Vladimir Bulantsev (GinCz) | github.com/GinCz/AI
# IMPORTANT: Replace placeholder keys (YOUR_GROQ_KEY, etc.) with valid API keys.
# Free API Key Portals:
#   Groq:       https://console.groq.com/keys
#   Gemini:     https://aistudio.google.com/apikey
#   Mistral:    https://console.mistral.ai/api-keys
#   OpenRouter: https://openrouter.ai/keys
#   OpenAI:     https://platform.openai.com/api-keys

name: Production AI Stack
version: 1.0.0
schema: v1

models:
  # ==========================================
  # AGENT MODE CAPABLE (Autonomous Tool Calling)
  # ==========================================
  - name: Groq Llama 3.3 70b (FREE) ⚡ + Agent
    provider: groq
    model: llama-3.3-70b-versatile
    apiKey: YOUR_GROQ_KEY
    roles:
      - chat
      - edit
      - agent

  - name: NVIDIA Nemotron 120b (OpenRouter FREE) + Agent
    provider: openrouter
    model: nvidia/nemotron-3-super-120b-a12b:free
    apiKey: YOUR_OPENROUTER_KEY
    roles:
      - chat
      - edit
      - agent

  - name: Mistral Large (FREE) + Agent
    provider: mistral
    model: mistral-large-latest
    apiKey: YOUR_MISTRAL_KEY
    roles:
      - chat
      - edit
      - agent

  - name: GPT-4o (OpenAI) + Agent
    provider: openai
    model: gpt-4o
    apiKey: YOUR_OPENAI_KEY
    roles:
      - chat
      - edit
      - agent

  # ==========================================
  # CHAT & INLINE EDIT ONLY
  # ==========================================
  - name: Gemini 2.0 Flash (FREE)
    provider: gemini
    model: gemini-2.0-flash
    apiKey: YOUR_GEMINI_KEY
    roles:
      - chat
      - edit

  - name: Claude 3.5 Sonnet (OpenRouter)
    provider: openrouter
    model: anthropic/claude-3.5-sonnet:free
    apiKey: YOUR_OPENROUTER_KEY
    roles:
      - chat
      - edit

# Fast inline tab autocomplete
tabAutocompleteModel:
  name: Groq Fast Autocomplete ⚡
  provider: groq
  model: llama-3.3-70b-versatile
  apiKey: YOUR_GROQ_KEY

# Context providers for multi-file understanding
context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase